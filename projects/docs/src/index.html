<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>hr-ui · Components for HR and payroll apps</title>
  <meta name="description" content="Accessible Angular 22 components for HR and payroll apps. Tailwind 4 tokens, dark mode, and one-line theming.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  <script>
    // Before the app starts, so the first paint is already in the right theme. A first visit follows
    // the OS setting; after that, ThemeService keeps the reader's own choice under 'app-theme'.
    (function () {
      try {
        var saved = localStorage.getItem('app-theme');
        var theme = saved === 'dark' || saved === 'light' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (!saved) localStorage.setItem('app-theme', theme);
        document.documentElement.classList.add(theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
