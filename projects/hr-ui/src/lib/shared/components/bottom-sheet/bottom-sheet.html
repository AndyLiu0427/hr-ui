<ng-template #sheetTemplate>
  <!-- The shadow is a solid copy of the sheet 100px lower. A pull upwards lifts the sheet off the
       bottom edge, and the copy fills that gap. (A drop shadow never showed on a sheet pinned there.) -->
  <div
    class="bg-secondary rounded-t-2xl shadow-[0_100px_0_var(--secondary-background)] overflow-hidden flex flex-col"
    [style.max-height]="maxHeight()"
    [style.transform]="panelTransform()"
    [style.opacity]="panelOpacity()"
    [style.transition]="panelTransition()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="resolvedAriaLabel()"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
  >
    <div
      class="flex justify-center pt-3 pb-2 cursor-grab active:cursor-grabbing touch-none"
      (pointerdown)="onDragStart($event)"
      (pointermove)="onDragMove($event)"
      (pointerup)="onDragEnd($event)"
      (pointercancel)="onDragCancel()"
    >
      <div class="w-10 h-1 bg-gray-300 rounded-full"></div>
    </div>

    <div class="flex items-center justify-between px-4 pb-3 border-b border-primary">
      <oct-text color="1" variant="lg" weight="semibold">{{ title() }}</oct-text>
      <oct-button variant="ghost" color="neutral" size="sm" icon="X" ariaLabel="Close" (buttonClick)="onCloseClick()" />
    </div>

    <!-- min-h-0 lets the body shrink under the sheet's max height, so it scrolls instead of running off screen. -->
    <div class="flex-1 min-h-0 overflow-y-auto overscroll-contain">
      <ng-content></ng-content>
    </div>

    @if (footerTemplate(); as footer) {
      <div class="border-t border-primary bg-secondary pb-[max(1rem,env(safe-area-inset-bottom))]">
        <ng-container [ngTemplateOutlet]="footer" />
      </div>
    }
  </div>
</ng-template>
