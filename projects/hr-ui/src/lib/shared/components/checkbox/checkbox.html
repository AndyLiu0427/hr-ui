<label [class]="labelClass()">
  <input
    #checkboxInput
    type="checkbox"
    [id]="computedId()"
    [name]="name()"
    [value]="htmlValue()"
    [checked]="checked()"
    [disabled]="disabled()"
    [required]="required()"
    [class]="inputClass()"
    (change)="onCheckboxChange($event)"
    (blur)="onBlur()"
  />

  <!-- Label Text (+ optional description below) -->
  @if (label()) {
    <span class="flex flex-col gap-0.5">
      <oct-text [color]="disabled() ? 'disabled' : hasError() ? 'error' : '2'" variant="sm" class="select-none leading-5">
        {{ label() }}
        @if (required()) {
          <span class="ml-1 text-error">*</span>
        }
      </oct-text>
      @if (description()) {
        <oct-text [color]="disabled() ? 'disabled' : '3'" variant="xs" [truncate]="false" class="select-none leading-4">
          {{ description() }}
        </oct-text>
      }
    </span>
  }
</label>

<!-- Error Message -->
@if (hasError() && errorMessage()) {
  <oct-text color="error" variant="sm">{{ errorMessage() }}</oct-text>
}
