@if (isVisible()) {
  <div
    #box
    [class]="snackbarClasses()"
    [style]="snackbarStyle()"
    [@slideIn]="{ value: animationState(), params: { slideDirection: slideDirection() } }"
    (@slideIn.done)="onAnimationDone($event)"
    (click)="onSnackbarClick()"
    (mouseenter)="setHovered(true)"
    (mouseleave)="setHovered(false)"
    (focusin)="setFocusWithin(true)"
    (focusout)="onFocusOut($event)"
    [title]="'SNACKBAR.CLICK_TO_COPY' | translate"
    [attr.role]="type() === 'error' ? 'alert' : 'status'"
    aria-atomic="true">

    <div class="flex items-center gap-3 flex-1 min-w-0">
      @if (defaultIcon()) {
        <oct-icon
          [name]="defaultIcon()!"
          [size]="size() === 'sm' ? 16 : size() === 'lg' ? 24 : 20"
          [class]="iconClasses()"
          aria-hidden="true"
        />
      }

      <div class="flex-1 min-w-0">
          <div [class]="textClasses()">{{ message() }}</div>
          @if (description()) {
            <div [class]="descriptionClasses()">{{ description() }}</div>
          }
      </div>
    </div>

    <div class="flex items-center gap-2 ml-3">
      @if (actionText()) {
        <oct-button
          type="button"
          variant="outline"
          shape="square"
          size="sm"
          [color]="buttonColor()"
          (buttonClick)="onActionClick($event)">
          {{ actionText() }}
        </oct-button>
      }

      @if (dismissible()) {
        <oct-button
          type="button"
          variant="ghost"
          size="sm"
          [color]="buttonColor()"
          shape="round"
          icon="X"
          [ariaLabel]="'SNACKBAR.DISMISS' | translate"
          (buttonClick)="onDismiss($event)">
        </oct-button>
      }
    </div>
  </div>
}
